{% extends 'base.html' %}
{% block title %}Форма работника{% endblock %}
{% block content %}
<div class="card">
    <h1>{% if object %}Редактирование{% else %}Добавление{% endif %} работника</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Сохранить</button>
        <a href="{% url 'worker_list' %}" class="btn">Отмена</a>
    </form>
</div>
{% endblock %}
