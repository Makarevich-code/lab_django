{% extends 'base.html' %}
{% block title %}Удаление спектакля{% endblock %}
{% block content %}
<div class="card">
    <h1>Удалить спектакль?</h1>
    <p>Вы уверены, что хотите удалить <strong>{{ object }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'performance_list' %}" class="btn">Отмена</a>
    </form>
</div>
{% endblock %}
