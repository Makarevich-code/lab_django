{% extends 'base.html' %}
{% block title %}Форма роли{% endblock %}
{% block content %}
<div class="card">
    <h1>{% if object %}Редактирование{% else %}Добавление{% endif %} роли</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Сохранить</button>
        <a href="{% url 'role_list' %}" class="btn">Отмена</a>
    </form>
</div>
{% endblock %}
