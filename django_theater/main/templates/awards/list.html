{% extends 'base.html' %}
{% block title %}Наградаы{% endblock %}
{% block content %}
<div class="card">
    <h1>Наградаы</h1>
    <div class="page-actions"><a href="{% url 'award_create' %}" class="btn btn-success">+ Добавить награда</a></div>
    <table class="data-table">
        <tr><th>ID</th><th>Название</th><th>Действия</th></tr>
        {% for obj in awards %}
        <tr>
            <td>{{ obj.pk }}</td>
            <td>{{ obj.name }}</td>
            <td>
                <a href="{% url 'award_detail' obj.pk %}" class="btn">Подробнее</a>
                <a href="{% url 'award_update' obj.pk %}" class="btn">Изменить</a>
                <a href="{% url 'award_delete' obj.pk %}" class="btn btn-danger">Удалить</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="3">Пусто</td></tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
